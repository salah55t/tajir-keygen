name: Build Keygen APK (مولّد المفاتيح)

on:
  push:
    branches: [ main ]
    tags: [ 'keygen-v*' ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Keygen APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify / install Android SDK components
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-34" ] && [ -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            echo "[OK] android-34 + build-tools 34.0.0 are preinstalled"
            exit 0
          fi
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ok=0
          for i in 1 2 3; do
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            if "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null; then
              ok=1; break
            fi
            sleep 15
          done
          if [ "$ok" != "1" ]; then exit 1; fi

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK file
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/TajirPro-Keygen.apk
          ls -lh apk-output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TajirPro-Keygen-APK
          path: apk-output/TajirPro-Keygen.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" apk-output/TajirPro-Keygen.apk \
            --title "مولّد مفاتيح تاجر برو ${GITHUB_REF_NAME}" \
            --notes "## 🔐 تحميل تطبيق مولّد المفاتيح (Android)

          ### طريقة الاستخدام
          1. ثبّت هذا التطبيق على هاتف المسؤول
          2. افتح تطبيق «تاجر برو» على هاتف التاجر واحصل على بصمة الجهاز
          3. أدخل البصمة هنا وولّد كود الاشتراك
          4. أرسل الكود للتاجر ليُفعّل اشتراكه

          ### المميزات
          - 🔑 توليد أكواد صالحة لجهاز واحد فقط
          - 🔍 التحقق من صحة أي كود
          - 📜 سجل محلي لكل الأكواد المُولّدة
          - 📊 تصدير السجل (CSV/JSON)
          - 🌙 وضع ليلي/نهاري
          - 📴 يعمل بدون إنترنت 100%" \
            || gh release upload "${GITHUB_REF_NAME}" apk-output/TajirPro-Keygen.apk --clobber
