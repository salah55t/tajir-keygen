<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#047857">
<title>مولّد مفاتيح تاجر برو</title>
<script>
/* تطبيق الوضع الليلي قبل الرسم لمنع وميض الشاشة */
try{
  var _t = localStorage.getItem('tajirpro_keygen_theme') || 'light';
  document.documentElement.setAttribute('data-theme', _t);
  if(_t === 'dark'){ document.querySelector('meta[name=theme-color]').setAttribute('content', '#0B1220'); }
}catch(e){}
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header id="topbar">
  <div class="brand">
    <div class="logo-box">🔐</div>
    <div>
      <div class="store-name">مولّد المفاتيح</div>
      <div class="page-sub">أداة مسؤول تاجر برو</div>
    </div>
  </div>
  <div class="topbar-actions">
    <button id="themeBtn" class="icon-btn" onclick="toggleTheme()" aria-label="تبديل الوضع" title="الوضع الليلي / النهاري">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>
      </svg>
    </button>
  </div>
</header>

<main id="view"></main>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="app.js"></script>
</body>
</html>
