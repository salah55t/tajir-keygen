plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tajirpro.keygen'
    compileSdk 34

    defaultConfig {
        applicationId "com.tajirpro.keygen"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // WebViewAssetLoader — serves assets over a secure (https) origin
    implementation 'androidx.webkit:webkit:1.11.0'
}
